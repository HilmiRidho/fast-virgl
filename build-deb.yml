name: Build virglrenderer deb (Termux aarch64)
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK r28c
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: false

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build pkg-config python3 file dpkg-dev unzip patch

      - name: Unpack inputs
        run: |
          mkdir epoxy
          tar -xzf android-aarch64-api30-virglrenderer_tar.gz -C epoxy
          unzip -q virglrenderer-main-fast.zip

      - name: Build (semua patch 0001-0003, venus on)
        run: |
          NDK="${{ steps.ndk.outputs.ndk-path }}" EPOXY_PREFIX="$PWD/epoxy" \
            bash build-termux-fast.sh "$PWD/virglrenderer-main"

      - name: Package .deb
        run: |
          S="$PWD/virglrenderer-main/out/data/data/com.termux/files/usr/opt/virglrenderer-android"
          cp -a epoxy/lib/libepoxy.so.0.0.0 "$S/lib/"
          ls -la "$S/bin" "$S/libexec" "$S/lib"
          readelf -d "$S/bin/virgl_test_server" | grep NEEDED || true
          readelf -d "$S/lib/libvirglrenderer.so" | grep SONAME || true
          bash make-deb.sh "$S" 1.3.0-3

      - uses: actions/upload-artifact@v4
        with:
          name: virglrenderer-android-deb
          path: "*.deb"
